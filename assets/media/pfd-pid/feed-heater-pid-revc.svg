<text x="60" y="624" font-size="9.5" font-weight="normal" fill="#5a6472" text-anchor="start">&#8226;  Action 1. High outlet temperature trip: TT-103 and TSHH-103, independent of loop 101, close XV-103 (fails closed).</text>
<text x="60" y="642" font-size="9.5" font-weight="normal" fill="#5a6472" text-anchor="start">&#8226;  Action 2. TAH 90 °C and TAL 70 °C on TIC-101. TAL also stops reactant addition to R-101 (logic on the reactor P&amp;ID).</text>
<text x="60" y="660" font-size="9.5" font-weight="normal" fill="#5a6472" text-anchor="start">&#8226;  Action 6. Check valve on line DN50-P-1004 against reverse flow from R-101 when P-101 stops.</text>
<text x="60" y="678" font-size="9.5" font-weight="normal" fill="#5a6472" text-anchor="start">&#8226;  Actions 3, 4, 5 and 7 are checks and studies with no change to this drawing.</text>
