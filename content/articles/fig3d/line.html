<p>Figure 2 shows a short length of the discharge line cut open. Change the pipe size and the flow and watch the velocity, the shape of the velocity profile and the pressure drop respond. Then thicken the liquid until the flow turns laminar: the profile becomes a parabola and the dye stops mixing.</p>
