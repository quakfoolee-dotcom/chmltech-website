<p>Most relief devices on process vessels are spring-loaded valves. A spring holds a disc down on a nozzle until the pressure under the disc is high enough to lift it. Figure 2 shows one on R-101.</p>
<figure class="psv3d" id="psv3d">
<div class="psv3d-box">
<div class="psv3d-stage">
<canvas role="img" aria-label="3D model of a spring-loaded pressure relief valve, cut in half. Gas from the vessel fills the inlet nozzle under the disc. A spring presses the disc onto the nozzle. When the vessel pressure reaches the 3 barg set pressure the disc lifts and gas flows out through the side outlet to the flare or scrubber. The valve closes again at about 2.8 barg."></canvas>
<svg class="psv3d-lines" aria-hidden="true"></svg>
<span class="psv3d-tag" id="psv3d-tin">From vessel R-101 · <b id="psv3d-pin">1.00 barg</b></span>
<span class="psv3d-tag" id="psv3d-tout">To flare or scrubber</span>
<span class="psv3d-drag" aria-hidden="true">Drag to turn</span>
<span class="psv3d-chip" id="psv3d-chip">Closed</span>
<p class="psv3d-nogl" id="psv3d-nogl" hidden>This browser cannot show the 3D model. The controls below still step through the event.</p>
</div>
<div class="psv3d-panel">
<div class="psv3d-ctl">
<button type="button" class="psv3d-btn" id="psv3d-run">Run an overpressure event</button>
<button type="button" class="psv3d-btn psv3d-ghost" id="psv3d-names" aria-pressed="true">Part names</button>
</div>
<div class="psv3d-slider">

<div class="psv3d-track"><input type="range" id="psv3d-p" min="0.5" max="3.4" step="0.01" value="1"><i style="--v:1;background:#5EC8FF"></i><i style="--v:2.8;background:#C9D2DE"></i><i style="--v:3;background:#8DC63F"></i><i style="--v:3.3;background:#FF7A5C"></i></div>
<ul class="psv3d-key"><li><i style="background:#5EC8FF"></i>1.0 normal</li><li><i style="background:#C9D2DE"></i>2.8 reseats</li><li><i style="background:#8DC63F"></i>3.0 set pressure = MAWP</li><li><i style="background:#FF7A5C"></i>3.3 limit while relieving</li></ul>
</div>

</div>

</div>
