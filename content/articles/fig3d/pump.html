<p>Figure 2 shows P-101 running, with a clear front cover so the flow is visible. The control valve sits downstream of the pump, on the discharge line. Move the valve, the pump speed, the tank level or the liquid temperature and watch the operating point, the pressures and the NPSH margin respond.</p>
