<g id="text_1">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(20.108869 110.804273)">Question</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(14.889572 125.216051)">"Which line</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(11.009025 139.260797)">lost most last</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(15.193322 152.685387)">month, and</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(17.766056 167.61818)">on what?"</text>
</g>
<g id="text_2">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(102.54015 117.164654)">LLM planner</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(100.486322 131.450572)">chooses tool,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(107.727103 146.493053)">filters and</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(109.164291 160.653814)">definition</text>
</g>
<g id="text_3">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(211.242262 47.087838)">KPI definitions as code</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(215.141091 60.402741)">ISO 22400 elements,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(210.782419 75.097174)">versioned (oee-def v3)</text>
</g>
<g id="text_4">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(241.210153 125.108473)">KPI tools</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(208.438903 138.399469)">compute_oee · loss_tree</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(210.011794 152.270543)">merge_stops · compare</text>
</g>
<g id="text_5">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(238.681716 203.274654)">Plant data</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(216.578981 216.671119)">MES shifts, stop log,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(221.745544 230.900084)">counts, SKU rates</text>
</g>
<g id="text_6">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(367.491094 118.137779)">Result with</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(364.395234 130.539322)">provenance:</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(367.250625 145.7611)">rows, filter,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(365.866875 160.653814)">definition id</text>
</g>
<g id="text_7">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(459.800972 118.137779)">LLM writes</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(458.325816 131.450572)">the answer;</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(454.405894 146.343287)">number-echo</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(470.289488 160.49983)">check</text>
</g>
<g id="text_8">
<text style="font-weight: 600; font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #e07a3a" transform="translate(392.829131 185.084992)">No number in the answer</text>
<text style="font-weight: 600; font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #e07a3a" transform="translate(395.114287 195.97464)">that a tool did not return</text>
</g>
<g id="text_9">
<text style="font-weight: 600; font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #4d7f12" x="259.8732" y="17.48556" transform="rotate(-0 259.8732 17.48556)">Deterministic, versioned, regression-tested</text>
</g>
</g>
</g>
