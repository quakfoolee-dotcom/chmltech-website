</g>
<g id="text_12">
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(386.316 72.302948)">Low-risk actions run</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(386.316 85.817909)">automatically</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(386.316 100.254807)">Approval kept for</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(386.316 114.583768)">consequential steps</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(386.316 128.801354)">Add a second agent</text>
</g>
