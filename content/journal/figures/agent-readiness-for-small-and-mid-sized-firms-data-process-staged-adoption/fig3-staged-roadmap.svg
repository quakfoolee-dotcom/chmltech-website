</g>
<g id="text_6">
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(140.796 71.443573)">Read-only assistant</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(140.796 86.572096)">on documents and ERP</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(140.796 101.096995)">Shadow-mode drafts</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(140.796 114.629143)">Staff compare with</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(140.796 129.804417)">their own work</text>
</g>
<g id="text_7">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="263.556" y="31.351935" transform="rotate(-0 263.556 31.351935)">Stage 2</text>
</g>
<g id="text_8">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="263.556" y="45.988095" transform="rotate(-0 263.556 45.988095)">Draft and approve</text>
</g>
<g id="text_9">
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(263.556 71.454573)">Agent writes drafts</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(263.556 86.677284)">into ERP or CMMS</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(263.556 100.104245)">A person approves</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(263.556 115.320768)">each one</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(263.556 128.852917)">Track acceptance</text>
</g>
<g id="text_10">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="386.316" y="31.351935" transform="rotate(-0 386.316 31.351935)">Stage 3</text>
</g>
