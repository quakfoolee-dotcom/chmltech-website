<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(18.036 86.722659)">first use case needs</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(18.036 100.104245)">Document the process</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(18.036 115.320768)">Name an owner</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(18.036 128.940917)">Set a data policy</text>
</g>
<g id="text_4">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="140.796" y="31.351935" transform="rotate(-0 140.796 31.351935)">Stage 1</text>
</g>
<g id="text_5">
