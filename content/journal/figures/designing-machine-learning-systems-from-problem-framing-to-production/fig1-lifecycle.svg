<g id="text_1">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(80.756438 154.527882)">new data</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(86.688 165.41753)">window</text>
</g>
<g id="text_2">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #b4410c" x="294.525" y="18.841863" transform="rotate(-0 294.525 18.841863)">fails to beat the baseline or move the business metric → reframe or stop</text>
</g>
<g id="text_3">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #b4410c" transform="translate(203.08275 146.583736)">data-quality alerts,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #b4410c" transform="translate(203.08275 157.473384)">label issues</text>
</g>
<g id="text_4">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="69.93" y="67.793858" transform="rotate(-0 69.93 67.793858)">1  Problem framing</text>
</g>
<g id="text_5">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(25.096641 79.943508)">decision, error costs,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(19.371094 92.890588)">non-ML baseline (§2–3)</text>
</g>
<g id="text_6">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="198.27" y="67.793858" transform="rotate(-0 198.27 67.793858)">2  Data</text>
</g>
<g id="text_7">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(160.122656 79.943508)">labels, imbalance,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(155.124844 92.583323)">leakage checks (§4)</text>
</g>
<g id="text_8">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="326.61" y="67.793858" transform="rotate(-0 326.61 67.793858)">3  Features</text>
</g>
<g id="text_9">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(287.893125 80.286633)">shared train/serve</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(294.659297 92.890588)">definitions (§5)</text>
</g>
<g id="text_10">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="454.95" y="67.793858" transform="rotate(-0 454.95 67.793858)">4  Training</text>
</g>
<g id="text_11">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(410.5125 79.989914)">baseline first; nested</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(411.070078 92.890588)">CV for selection (§6)</text>
</g>
<g id="text_12">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="454.95" y="229.854444" transform="rotate(-0 454.95 229.854444)">5  Evaluation</text>
</g>
<g id="text_13">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(413.036719 242.004094)">metrics, calibration,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(409.031016 254.951174)">A/B or shadow (§7–8)</text>
</g>
<g id="text_14">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="326.61" y="229.854444" transform="rotate(-0 326.61 229.854444)">6  Deployment</text>
</g>
<g id="text_15">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(282.987422 241.749562)">shadow → canary →</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(283.964063 254.826017)">rollout; rollback (§9)</text>
</g>
<g id="text_16">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="198.27" y="229.854444" transform="rotate(-0 198.27 229.854444)">7  Monitoring</text>
</g>
<g id="text_17">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(161.233594 241.903547)">data quality, drift,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(156.086719 254.679064)">delayed labels (§10)</text>
</g>
<g id="text_18">
<text style="font-weight: 700; font-size: 9.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="69.93" y="229.854444" transform="rotate(-0 69.93 229.854444)">8  Retraining</text>
</g>
<g id="text_19">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(42.157266 242.632687)">scheduled or</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(19.040625 254.643908)">detector-triggered (§10)</text>
</g>
</g>
</g>
