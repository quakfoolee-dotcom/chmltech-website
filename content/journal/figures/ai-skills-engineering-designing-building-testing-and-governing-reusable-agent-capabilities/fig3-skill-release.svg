e marker-end="url(#arrow)" stroke="#0d2544" stroke-width="3.1" x1="960" x2="976" y1="227" y2="227" /><rect fill="#fbfdff" height="186" rx="13" ry="13" stroke="#07818d" stroke-width="2" width="205" x="982" y="130" /><rect fill="#07818d" height="53" rx="12" ry="12" width="205" x="982" y="130" /><rect fill="#07818d" height="13" width="205" x="982" y="170" /><text fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1084.5" y="165">5. PUBLISH</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1084.5" y="231">Catalog + hash</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1084.5" y="260">+ rollout policy</text><line marker-end="url(#arrow)" stroke="#0d2544" stroke-width="3.1" x1="1192" x2="1208" y1="227" y2="227" /><rect fill="#fbfdff" height="186" rx="13" ry="13" stroke="#c53d79" stroke-width="2" width="205" x="1214" y="130" /><rect fill="#c53d79" height="53" rx="12" ry="12" width="205" x="1214" y="130" /><rect fill="#c53d79" height="13" width="205" x="1214" y="170" /><text fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1316.5" y="165">6. MONITOR</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1316.5" y="231">Drift • cost</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1316.5" y="260">+ incident signals</text><path d="M 185,334 V 370 H 630 V 317" fill="none" stroke="#da7219" stroke-dasharray="8 6" stroke-width="3" /><polygon points="177,334 193,334 185,318" fill="#da7219" /><text fill="#b15c10" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="392" y="391">FAILED CHECK → R