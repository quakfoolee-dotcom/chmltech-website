nt-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="725.0" y="162">4. RESOURCES</text><text fill="#e7771b" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="725.0" y="226">04</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="725.0" y="268">Read references</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="725.0" y="293">or approved scripts</text><line marker-end="url(#arrow)" stroke="#0d2544" stroke-width="3.1" x1="820.5" x2="830.5" y1="230" y2="230" /><rect fill="#f9fbfe" height="195" rx="12" ry="12" stroke="#dce5ef" stroke-width="1.6" width="185" x="835.5" y="130" /><rect fill="#0e8690" height="50" rx="11" ry="11" width="185" x="835.5" y="130" /><rect fill="#0e8690" height="13" width="185" x="835.5" y="167" /><text fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="928.0" y="162">5. TOOL BROKER</text><text fill="#0e8690" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="928.0" y="226">05</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="928.0" y="268">Policy-check each</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="928.0" y="293">typed tool call</text><line marker-end="url(#arrow)" stroke="#0d2544" stroke-width="3.1" x1="1023.5" x2="1033.5" y1="230" y2="230" /><rect fill="#f9fbfe" height="195" rx="12" ry="12" stroke="#dce5ef" stroke-width="1.6" width="185" x="1038.5" y="130" /><rect fill="#c33b78" height="50" rx="11" ry="11" width="185" x="1038.5" y="130" /><rect fill="#c33b78" height="13" width="185" x="1038.5" y="167" /><text fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1131.0" y="162">6. ASSURANCE</text><text fill="#c33b78" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="1131.0" y="226">06</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1131.0" y="268">Validate facts,</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1131.0" y="293">schema and output</text><line marker-end="url(#arrow)" stroke="#0d2544" stroke-width="3.1" x1="1226.5" x2="1236.5" y1="230" y2="230" /><rect fill="#f9fbfe" height="195" rx="12" ry="12" stroke="#dce5ef" stroke-width="1.6" width="185" x="1241.5" y="130" /><rect fill="#175c9d" height="50" rx="11" ry="11" width="185" x="1241.5" y="130" /><rect fill="#175c9d" height="13" width="185" x="1241.5" y="167" /><text fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1334.0" y="162">7. ARTIFACT</text><text fill="#175c9d" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="1334.0" y="226">07</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1334.0" y="268">Versioned result</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1334.0" y="293">with evidence IDs</text><rect fill="#eaf4fc" height="105" rx="13" ry="13" stroke="#d8e5eb" stroke-width="1.2" width="395" x="65" y="375" /><text fill="#0d2544" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="262.5" y="405">Selection boundary</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="262.5" y="437">Host resolves the catalog; skill text</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="262.5" y="461">is not an access-control rule</text><rect fill="#eaf6ed" height="105" rx="13" ry="13" stroke="#d8e5eb" stroke-width="1.2" width="395" x="530" y="375" /><text fill="#0d2544" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="727.5" y="405">Execution boundary</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="727.5" y="437">Least privilege • approval • input validation</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="727.5" y="461">secret isolation at the tool boundary</text><rect fill="#fff3e5" height="105" rx="13" ry="13" stroke="#d8e5eb" stroke-width="1.2" width="395" x="995" y="375" /><text fill="#0d2544" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1192.5" y="405">Assurance boundary</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1192.5" y="437">Checks evidence • logs outcome</text><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="middle" x="1192.5" y="461">handles failure and rollback</text><circle cx="130" cy="544" fill="#1765b9" r="9" /><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="130" y="579">READ-ONLY EVIDENCE</text><circle cx="485" cy="544" fill="#1765b9" r="9" /><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="485" y="579">MODEL / AGENT CONTEXT</text><circle cx="850" cy="544" fill="#1765b9" r="9" /><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="850" y="579">TOOL POLICY SERVICE</text><circle cx="1225" cy="544" fill="#1765b9" r="9" /><text fill="#57718a" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="1225" y="579">OUTPUT / TRACE</text><line stroke="#8ca6be" stroke-dasharray="7 7" stroke-width="2" x1="130" x2="1225" y1="544" y2="544" /><text fill="#0d2544" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="725.0" y="631">Skill instructions guide behavior; only the host and tool boundary can enforce privileges.</text></svg>