<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="665" viewBox="0 0 1350 665" role="img" aria-label="Four axes of multi-agent architecture: control topology, information exchange, task allocation and workflow scheduling. A hybrid may use a supervisor, versioned blackboard, selective bids and parallel tasks."><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#294764"/></marker></defs><rect x="0" y="0" width="1350" height="665" rx="20" fill="#f9fbfd" stroke="#d9e4ef"/><text x="675" y="52" font-size="29" text-anchor="middle" font-weight="700" font-family="Arial,sans-serif" fill="#092343">Architecture selection: four independent axes</text><text x="675" y="82" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#526b82">Choose each axis based on its own requirement — then combine deliberately</text><rect x="30" y="111" width="1290" height="91" rx="13" fill="#ffffff" stroke="#d6e2ed"/><rect x="30" y="111" width="282" height="91" rx="12" fill="#1870c4"/><text x="171" y="152" font-family="Arial,sans-serif" fill="white" font-size="19" font-weight="700" text-anchor="middle">1 · CONTROL TOPOLOGY</text><text x="171" y="178" font-family="Arial,sans-serif" fill="white" font-size="14" text-anchor="middle">a distinct engineering decision</text><rect x="330" y="132" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#1870c4" stroke-width="1.5"/><text x="476.0" y="162" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Central lead</text><rect x="655" y="132" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#1870c4" stroke-width="1.5"/><text x="801.0" y="162" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Nested supervisors</text><rect x="980" y="132" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#1870c4" stroke-width="1.5"/><text x="1126.0" y="162" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Peer mesh</text><rect x="30" y="216" width="1290" height="91" rx="13" fill="#ffffff" stroke="#d6e2ed"/><rect x="30" y="216" width="282" height="91" rx="12" fill="#11834f"/><text x="171" y="257" font-family="Arial,sans-serif" fill="white" font-size="19" font-weight="700" text-anchor="middle">2 · SHARED INFORMATION</text><text x="171" y="283" font-family="Arial,sans-serif" fill="white" font-size="14" text-anchor="middle">a distinct engineering decision</text><rect x="330" y="237" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#11834f" stroke-width="1.5"/><text x="476.0" y="267" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Private artifacts</text><rect x="655" y="237" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#11834f" stroke-width="1.5"/><text x="801.0" y="267" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Versioned blackboard</text><rect x="980" y="237" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#11834f" stroke-width="1.5"/><text x="1126.0" y="267" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Pub/sub events</text><rect x="30" y="321" width="1290" height="91" rx="13" fill="#ffffff" stroke="#d6e2ed"/><rect x="30" y="321" width="282" height="91" rx="12" fill="#6d49aa"/><text x="171" y="362" font-family="Arial,sans-serif" fill="white" font-size="19" font-weight="700" text-anchor="middle">3 · TASK ALLOCATION</text><text x="171" y="388" font-family="Arial,sans-serif" fill="white" font-size="14" text-anchor="middle">a distinct engineering decision</text><rect x="330" y="342" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#6d49aa" stroke-width="1.5"/><text x="476.0" y="372" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Fixed owner</text><rect x="655" y="342" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#6d49aa" stroke-width="1.5"/><text x="801.0" y="372" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Policy-based router</text><rect x="980" y="342" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#6d49aa" stroke-width="1.5"/><text x="1126.0" y="372" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Validated bids</text><rect x="30" y="426" width="1290" height="91" rx="13" fill="#ffffff" stroke="#d6e2ed"/><rect x="30" y="426" width="282" height="91" rx="12" fill="#db741b"/><text x="171" y="467" font-family="Arial,sans-serif" fill="white" font-size="19" font-weight="700" text-anchor="middle">4 · EXECUTION ORDER</text><text x="171" y="493" font-family="Arial,sans-serif" fill="white" font-size="14" text-anchor="middle">a distinct engineering decision</text><rect x="330" y="447" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#db741b" stroke-width="1.5"/><text x="476.0" y="477" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Sequential chain</text><rect x="655" y="447" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#db741b" stroke-width="1.5"/><text x="801.0" y="477" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Parallel branches</text><rect x="980" y="447" width="292" height="48" rx="9" fill="#f5f8fb" stroke="#db741b" stroke-width="1.5"/><text x="1126.0" y="477" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" fill="#1f3550">Stage-gate loop</text><rect x="30" y="545" width="1290" height="94" rx="14" fill="#edf5fd" stroke="#91b7df"/><text x="62" y="572" font-family="Arial,sans-serif" font-weight="700" font-size="21" fill="#143b65">EXAMPLE HYBRID</text><text x="62" y="603" font-family="Arial,sans-serif" font-size="19" fill="#234b6f">One accountable supervisor  +  versioned evidence blackboard  +  optional capability bids  +  bounded parallel work</text><text x="62" y="628" font-family="Arial,sans-serif" font-size="14" fill="#526b82">Authorization, provenance, monitoring, retries and human approval remain cross-cutting requirements.</text></svg>