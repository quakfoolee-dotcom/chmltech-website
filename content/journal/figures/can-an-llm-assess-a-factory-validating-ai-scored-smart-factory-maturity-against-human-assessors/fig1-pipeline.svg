<g id="text_1">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="56.58264" y="85.057825" transform="rotate(-0 56.58264 85.057825)">1  Evidence pack</text>
</g>
<g id="text_2">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(20.511624 148.950269)">Documents, data</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(13.805921 163.21439)">extracts, interviews,</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(12.730843 177.081246)">photos; each tagged</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(28.229124 191.380523)">by dimension</text>
</g>
<g id="text_3">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(125.65679 77.193079)">2  Retrieve per</text>
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(135.43179 93.886634)">dimension</text>
</g>
<g id="text_4">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(122.124212 148.910894)">Only the evidence</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(122.208587 163.996969)">for one dimension</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(130.630618 177.188824)">at a time goes</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(134.014056 192.15607)">to the model</text>
</g>
<g id="text_5">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(225.741878 77.134485)">3  Score against</text>
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(241.017659 93.886634)">the rubric</text>
</g>
<g id="text_6">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(229.541096 141.979576)">Band 0–5, rubric</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(227.44719 155.899166)">sentence, quoted</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(238.152971 170.292662)">evidence, or</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(238.953128 185.231783)">"insufficient</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(243.077659 199.34192)">evidence"</text>
</g>
<g id="text_7">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="368.44884" y="85.897669" transform="rotate(-0 368.44884 85.897669)">4  Check</text>
</g>
<g id="text_8">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(331.640246 149.057847)">Citations resolve;</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(334.082199 163.946344)">no band without</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(322.120637 177.241558)">evidence; repeat runs</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(356.296027 190.455914)">agree</text>
</g>
<g id="text_9">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="472.40424" y="86.021887" transform="rotate(-0 472.40424 86.021887)">5  Assessor review</text>
</g>
<g id="text_10">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(433.497521 148.820894)">Human accepts or</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(429.173302 162.924703)">changes each band;</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(432.338068 177.23523)">reasons logged for</text>
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(431.70174 192.259429)">the next calibration</text>
</g>
<g id="text_11">
<text style="font-weight: 600; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="262.44" y="26.16192" transform="rotate(-0 262.44 26.16192)">Each band carries its evidence; gaps are reported, never filled</text>
</g>
<g id="text_12">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #4a5568" x="262.44" y="240.38208" transform="rotate(-0 262.44 240.38208)">Agreement with human assessors (weighted κ, bias, coverage) is measured on step 3 before step 5 is relaxed</text>
</g>
</g>
</g>
