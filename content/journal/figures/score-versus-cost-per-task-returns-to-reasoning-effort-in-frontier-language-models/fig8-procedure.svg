<g id="text_1">
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(23.05725 70.187516)">1. Build a test set</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(18.286687 80.835172)">of 100–300 of your</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(36.943375 91.482828)">own tasks</text>
</g>
<g id="text_2">
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(139.55425 70.187516)">2. Run 2–3 candidate</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(151.09325 80.835172)">models at a low</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(156.552687 91.482828)">effort setting</text>
</g>
<g id="text_3">
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(269.969688 70.187516)">3. Step one setting</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(272.569125 80.835172)">up and re-run the</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(285.534 91.482828)">same tasks</text>
</g>
<g id="text_4">
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(402.098438 70.187516)">4. Is the gain larger</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(397.017813 80.835172)">than the 95% interval</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(400.532313 91.482828)">and worth the cost?</text>
</g>
<g id="text_5">
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #4d7f12" transform="translate(395.135438 200.867516)">Stop: use the previous</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #4d7f12" transform="translate(399.330563 211.515172)">setting; budget from</text>
<text style="font-weight: 600; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #4d7f12" transform="translate(406.015813 222.162828)">measured tokens</text>
</g>
<g id="text_6">
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(219.950312 200.867516)">Record cost per task and</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(221.277187 211.515172)">cost per correct answer,</text>
<text style="font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(226.716 222.162828)">at a dated price sheet</text>
</g>
<g id="text_7">
<text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #4a5568" x="460.251" y="142.974" transform="rotate(-0 460.251 142.974)">No</text>
</g>
<g id="text_8">
<text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #4a5568" x="357.3" y="17.9568" transform="rotate(-0 357.3 17.9568)">Yes: keep it and test the next setting</text>
</g>
</g>
