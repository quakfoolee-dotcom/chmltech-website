<g id="text_1">
<text style="font-weight: 600; font-size: 9.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="164.434909" y="28.11875" transform="rotate(-0 164.434909 28.11875)">AI applications and agents (consumers of the platform)</text>
</g>
<g id="text_2">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="59.375811" transform="rotate(-0 19.760727 59.375811)">Workflow orchestration</text>
</g>
<g id="text_3">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="70.633926" transform="rotate(-0 19.760727 70.633926)">state machines, queues, retries, human-approval gates</text>
</g>
<g id="text_4">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="91.935811" transform="rotate(-0 19.760727 91.935811)">Agent and tool</text>
</g>
<g id="text_5">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="103.193926" transform="rotate(-0 19.760727 103.193926)">tool registry with schemas, ReAct-style loops, sandboxes</text>
</g>
<g id="text_6">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="124.495811" transform="rotate(-0 19.760727 124.495811)">Memory</text>
</g>
<g id="text_7">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="135.753926" transform="rotate(-0 19.760727 135.753926)">session state, episodic and semantic stores, retention rules</text>
</g>
<g id="text_8">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="157.055811" transform="rotate(-0 19.760727 157.055811)">Model access and routing</text>
</g>
<g id="text_9">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="168.313926" transform="rotate(-0 19.760727 168.313926)">model gateway, routers, cascades, caching, fallbacks</text>
</g>
<g id="text_10">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="189.615811" transform="rotate(-0 19.760727 189.615811)">Knowledge and retrieval</text>
</g>
<g id="text_11">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="200.873926" transform="rotate(-0 19.760727 200.873926)">hybrid search, re-ranking, access-filtered indexes</text>
</g>
<g id="text_12">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2a5a" x="19.760727" y="222.175811" transform="rotate(-0 19.760727 222.175811)">Data and integration</text>
</g>
<g id="text_13">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #4a5568" x="19.760727" y="233.433926" transform="rotate(-0 19.760727 233.433926)">connectors, APIs, MCP servers, data contracts</text>
</g>
<g id="text_14">
<text style="font-size: 9.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2a5a" x="164.434909" y="270.071313" transform="rotate(-0 164.434909 270.071313)">Systems of record: ERP, CRM, document management, email</text>
</g>
<g id="text_15">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(341.499738 206.216953) rotate(-90)">Identity and permissions</text>
</g>
<g id="text_16">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(355.785271 226.265859) rotate(-90)">SSO, delegated tokens, RBAC/ABAC</text>
</g>
<g id="text_17">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(388.168829 177.558125) rotate(-90)">Governance</text>
</g>
<g id="text_18">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(402.454362 234.97125) rotate(-90)">inventory, risk assessment, model cards</text>
</g>
<g id="text_19">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(434.83792 214.560625) rotate(-90)">Evaluation and observability</text>
</g>
<g id="text_20">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(449.123453 226.380469) rotate(-90)">test suites, calibrated judges, traces</text>
</g>
<g id="text_21">
<text style="font-weight: 600; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(481.507011 177.674648) rotate(-90)">Cost control</text>
</g>
<g id="text_22">
<text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #4a5568" transform="translate(495.792544 205.523672) rotate(-90)">metering, budgets, quotas</text>
</g>
<g id="text_23">
<text style="font-style: italic; font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(357.758374 23.389102)">Cross-cutting layers apply</text>
<text style="font-style: italic; font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #0b2a5a" transform="translate(379.546108 34.27875)">to every request</text>
</g>
</g>
</g>
