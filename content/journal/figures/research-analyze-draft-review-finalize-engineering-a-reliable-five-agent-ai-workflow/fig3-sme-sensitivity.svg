-size="17" font-weight="bold" text-anchor="start" x="885" y="137">Cost assumptions</text><text fill="#0c2242" font-family="Arial, sans-serif" font-size="33" font-weight="bold" text-anchor="start" x="885" y="179">$15k + $20k</text><text fill="#5b7287" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="885" y="205">Recurring / year  +  one-time</text><rect fill="#188553" height="65" rx="13" ry="13" stroke="#188553" stroke-width="1.7" width="592" x="42" y="254" /><text fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="62" y="282">70% realization</text><text fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="62" y="305">Conditional, conservative case</text><rect fill="#1765b9" height="65" rx="13" ry="13" stroke="#1765b9" stroke-width="1.7" width="592" x="656" y="254" /><text fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="676" y="282">100% realization</text><text fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="676" y="305">Theoretical full scenario</text><rect fill="#f4faf6" height="54" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="592" x="42" y="341" /><text fill="#162b45" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="60" y="375">Gross annual capacity value</text><text fill="#188553" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="end" x="610" y="376">$25,270</text><rect fill="#f3f8fe" height="54" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="592" x="656" y="341" /><text fill="#162b45" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="674" y="375">Gross annual capacity value</text><text fill="#1765b9" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="end" x=