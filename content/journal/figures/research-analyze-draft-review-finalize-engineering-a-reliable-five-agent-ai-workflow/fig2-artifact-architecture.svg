t-anchor="middle" x="735" y="442">REWORK TO ANALYSIS</text><rect fill="#f7fafc" height="116" rx="14" ry="14" stroke="#dce5ee" stroke-width="1.7" width="1396" x="31" y="488" /><text fill="#0c2242" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="52" y="518">CROSS-CUTTING CONTROLS</text><rect fill="#ffffff" height="48" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="305" x="53" y="537" /><text fill="#0c2242" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="64" y="555">SOURCE PROVENANCE</text><text fill="#5b7287" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="64" y="574">Evidence ID + date + authority</text><rect fill="#ffffff" height="48" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="305" x="385" y="537" /><text fill="#0c2242" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="396" y="555">STRUCTURED HANDOFF</text><text fill="#5b7287" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="396" y="574">Schema + dependency ID</text><rect fill="#ffffff" height="48" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="305" x="731" y="537" /><text fill="#0c2242" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="742" y="555">DURABLE WORKFLOW</text><text fill="#5b7287" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="742" y="574">Version + checkpoint + trace</text><rect fill="#ffffff" height="48" rx="8" ry="8" stroke="#dce5ee" stroke-width="1" width="305" x="1080" y="537" /><text fill="#0c2242" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" x="1091" y="555">RELEASE CONTROL</text><text fill="#5b7287" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="1091" y="574">Approver + exact file hash</text></svg>