<svg viewBox="0 0 400 320" role="img" aria-label="Animated illustration for Inventory Management for SMEs: Service, Stock and Cash" xmlns="http://www.w3.org/2000/svg"><style>
.ha-spin{transform-box:fill-box;transform-origin:center;animation:ha-spin 12s linear infinite}
.ha-spin-r{transform-box:fill-box;transform-origin:center;animation:ha-spin 8s linear infinite reverse}
.ha-pulse{transform-box:fill-box;transform-origin:center;animation:ha-pulse 2.4s ease-in-out infinite}
.ha-float{animation:ha-float 4s ease-in-out infinite}
.ha-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:ha-draw 3.2s ease-out infinite}
.ha-grow{transform-box:fill-box;transform-origin:left center;animation:ha-grow 6s ease-in-out infinite}
.ha-drop{animation:ha-drop 6s cubic-bezier(.2,.8,.2,1) infinite}
.ha-twinkle{transform-box:fill-box;transform-origin:center;animation:ha-twinkle 2.2s ease-in-out infinite}
.ha-label{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;fill:#F6F5F1}
.ha-small{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:#B4C2D6;letter-spacing:.06em}
@keyframes ha-spin{to{transform:rotate(360deg)}}
@keyframes ha-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
@keyframes ha-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ha-draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
@keyframes ha-grow{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@keyframes ha-drop{0%{transform:translateY(-60px);opacity:0}12%,88%{transform:none;opacity:1}100%{opacity:0}}
@keyframes ha-twinkle{0%,100%{transform:scale(.4);opacity:0}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}.ha-draw{stroke-dashoffset:0}}
</style><text class="ha-small" x="200" y="26" text-anchor="middle">THE RIGHT STOCK · AT THE RIGHT TIME</text><rect x="40" y="172" width="258" height="28" fill="#8DC63F" opacity=".14"/><text class="ha-small" x="304" y="183">SAFETY</text><text class="ha-small" x="304" y="197">STOCK</text><line x1="40" y1="150" x2="298" y2="150" stroke="#F2A93B" stroke-width="2" stroke-dasharray="6 5"/><text class="ha-small" x="304" y="148">REORDER</text><text class="ha-small" x="304" y="162">POINT</text><line x1="40" y1="200" x2="298" y2="200" stroke="#4A6089" stroke-width="1.5"/><line x1="40" y1="50" x2="40" y2="200" stroke="#4A6089" stroke-width="1.5"/><path class="ha-draw" d="M40 90 L115 192 L115 85 L190 190 L190 88 L265 194 L265 86 L296 128" fill="none" stroke="#29B6F6" stroke-width="3" stroke-linejoin="round" style="stroke-dasharray:900;stroke-dashoffset:900;animation-duration:5s"/><g class="ha-pulse" style="animation-delay:.8s"><circle cx="88" cy="150" r="5" fill="#F2A93B"/></g><g class="ha-pulse" style="animation-delay:2s"><circle cx="163" cy="150" r="5" fill="#F2A93B"/></g><g class="ha-pulse" style="animation-delay:3.2s"><circle cx="238" cy="150" r="5" fill="#F2A93B"/></g><rect x="40" y="268" width="168" height="6" rx="2" fill="#4A6089"/><g class="ha-drop" style="animation-delay:0.00s;animation-duration:6s"><rect x="52" y="236" width="40" height="30" rx="4" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><path d="M72 236 V266" stroke="#29B6F6" stroke-width="1.2" opacity=".6"/></g><g class="ha-drop" style="animation-delay:0.35s;animation-duration:6s"><rect x="96" y="236" width="40" height="30" rx="4" fill="#13366E" stroke="#8DC63F" stroke-width="2"/><path d="M116 236 V266" stroke="#8DC63F" stroke-width="1.2" opacity=".6"/></g><g class="ha-drop" style="animation-delay:0.70s;animation-duration:6s"><rect x="140" y="236" width="40" height="30" rx="4" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><path d="M160 236 V266" stroke="#29B6F6" stroke-width="1.2" opacity=".6"/></g><g class="ha-drop" style="animation-delay:1.05s;animation-duration:6s"><rect x="74" y="204" width="40" height="30" rx="4" fill="#13366E" stroke="#F2A93B" stroke-width="2"/><path d="M94 204 V234" stroke="#F2A93B" stroke-width="1.2" opacity=".6"/></g><g class="ha-drop" style="animation-delay:1.40s;animation-duration:6s"><rect x="118" y="204" width="40" height="30" rx="4" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><path d="M138 204 V234" stroke="#29B6F6" stroke-width="1.2" opacity=".6"/></g><g class="ha-float"><rect x="244" y="222" width="116" height="46" rx="10" fill="#13366E" stroke="#8DC63F" stroke-width="2"/><text class="ha-label" x="302" y="242" text-anchor="middle">Turns ↑</text><text class="ha-small" x="302" y="258" text-anchor="middle">FILL RATE HELD</text></g></svg>