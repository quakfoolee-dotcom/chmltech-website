<svg viewBox="0 0 400 320" role="img" aria-label="Animated illustration for Cybersecurity and Ransomware Basics for SMEs" xmlns="http://www.w3.org/2000/svg"><style>
.ha-spin{transform-box:fill-box;transform-origin:center;animation:ha-spin 12s linear infinite}
.ha-spin-r{transform-box:fill-box;transform-origin:center;animation:ha-spin 8s linear infinite reverse}
.ha-pulse{transform-box:fill-box;transform-origin:center;animation:ha-pulse 2.4s ease-in-out infinite}
.ha-float{animation:ha-float 4s ease-in-out infinite}
.ha-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:ha-draw 3.2s ease-out infinite}
.ha-grow{transform-box:fill-box;transform-origin:left center;animation:ha-grow 6s ease-in-out infinite}
.ha-drop{animation:ha-drop 6s cubic-bezier(.2,.8,.2,1) infinite}
.ha-twinkle{transform-box:fill-box;transform-origin:center;animation:ha-twinkle 2.2s ease-in-out infinite}
.ha-label{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;fill:#F6F5F1}
.ha-small{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:#B4C2D6;letter-spacing:.06em}
@keyframes ha-spin{to{transform:rotate(360deg)}}
@keyframes ha-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
@keyframes ha-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ha-draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
@keyframes ha-grow{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@keyframes ha-drop{0%{transform:translateY(-60px);opacity:0}12%,88%{transform:none;opacity:1}100%{opacity:0}}
@keyframes ha-twinkle{0%,100%{transform:scale(.4);opacity:0}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}.ha-draw{stroke-dashoffset:0}}
</style><text class="ha-small" x="200" y="26" text-anchor="middle">STOP THE COMMON ATTACKS</text><g class="ha-twinkle" style="animation-delay:0.0s"><circle cx="62" cy="90" r="7" fill="#E5533D"/></g><text class="ha-small" x="62" y="112" text-anchor="middle">PHISHING</text><path d="M72 90 L124 90" stroke="#E5533D" stroke-width="1.6" stroke-dasharray="4 5" opacity=".7"/><g class="ha-pulse" style="animation-delay:0.3s"><circle cx="130" cy="90" r="4" fill="#F2A93B"/></g><g class="ha-twinkle" style="animation-delay:0.6s"><circle cx="338" cy="96" r="7" fill="#E5533D"/></g><text class="ha-small" x="338" y="118" text-anchor="middle">RANSOMWARE</text><path d="M328 96 L276 96" stroke="#E5533D" stroke-width="1.6" stroke-dasharray="4 5" opacity=".7"/><g class="ha-pulse" style="animation-delay:0.8999999999999999s"><circle cx="270" cy="96" r="4" fill="#F2A93B"/></g><g class="ha-twinkle" style="animation-delay:1.2s"><circle cx="56" cy="214" r="7" fill="#E5533D"/></g><text class="ha-small" x="56" y="236" text-anchor="middle">PASSWORDS</text><path d="M66 214 L124 200" stroke="#E5533D" stroke-width="1.6" stroke-dasharray="4 5" opacity=".7"/><g class="ha-pulse" style="animation-delay:1.5s"><circle cx="130" cy="200" r="4" fill="#F2A93B"/></g><g class="ha-twinkle" style="animation-delay:1.7999999999999998s"><circle cx="344" cy="214" r="7" fill="#E5533D"/></g><text class="ha-small" x="344" y="236" text-anchor="middle">FRAUD</text><path d="M334 214 L276 200" stroke="#E5533D" stroke-width="1.6" stroke-dasharray="4 5" opacity=".7"/><g class="ha-pulse" style="animation-delay:2.0999999999999996s"><circle cx="270" cy="200" r="4" fill="#F2A93B"/></g><path d="M200 62 L262 86 V150 C262 196 234 230 200 242 C166 230 138 196 138 150 V86 Z" fill="#13366E" stroke="#29B6F6" stroke-width="3"/><rect x="180" y="146" width="40" height="34" rx="6" fill="none" stroke="#8DC63F" stroke-width="3"/><path d="M188 146 V134 a12 12 0 0 1 24 0 V146" fill="none" stroke="#8DC63F" stroke-width="3"/><circle cx="200" cy="162" r="4" fill="#8DC63F"/><g class="ha-float" style="animation-delay:0.0s"><rect x="34" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#29B6F6" stroke-width="1.8"/><text class="ha-label" x="86" y="286" text-anchor="middle" style="font-size:13px">MFA</text></g><g class="ha-float" style="animation-delay:0.5s"><rect x="148" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#8DC63F" stroke-width="1.8"/><text class="ha-label" x="200" y="286" text-anchor="middle" style="font-size:13px">Backups</text></g><g class="ha-float" style="animation-delay:1.0s"><rect x="262" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#F2A93B" stroke-width="1.8"/><text class="ha-label" x="314" y="286" text-anchor="middle" style="font-size:13px">Patching</text></g></svg>