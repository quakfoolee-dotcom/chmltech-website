<svg viewBox="0 0 400 320" role="img" aria-label="Animated illustration for Business Basics for Owners: Cash, Costs, Strategy and Sales" xmlns="http://www.w3.org/2000/svg"><style>
.ha-spin{transform-box:fill-box;transform-origin:center;animation:ha-spin 12s linear infinite}
.ha-spin-r{transform-box:fill-box;transform-origin:center;animation:ha-spin 8s linear infinite reverse}
.ha-pulse{transform-box:fill-box;transform-origin:center;animation:ha-pulse 2.4s ease-in-out infinite}
.ha-float{animation:ha-float 4s ease-in-out infinite}
.ha-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:ha-draw 3.2s ease-out infinite}
.ha-grow{transform-box:fill-box;transform-origin:left center;animation:ha-grow 6s ease-in-out infinite}
.ha-drop{animation:ha-drop 6s cubic-bezier(.2,.8,.2,1) infinite}
.ha-twinkle{transform-box:fill-box;transform-origin:center;animation:ha-twinkle 2.2s ease-in-out infinite}
.ha-label{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;fill:#F6F5F1}
.ha-small{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:#B4C2D6;letter-spacing:.06em}
@keyframes ha-spin{to{transform:rotate(360deg)}}
@keyframes ha-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
@keyframes ha-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ha-draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}
@keyframes ha-grow{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@keyframes ha-drop{0%{transform:translateY(-60px);opacity:0}12%,88%{transform:none;opacity:1}100%{opacity:0}}
@keyframes ha-twinkle{0%,100%{transform:scale(.4);opacity:0}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}.ha-draw{stroke-dashoffset:0}}
</style><text class="ha-small" x="200" y="26" text-anchor="middle">CASH · COSTS · STRATEGY · SALES</text><line x1="56" y1="230" x2="350" y2="230" stroke="#4A6089" stroke-width="1.5"/><rect x="70" y="190" width="30" height="40" rx="4" fill="#29B6F6" opacity="0.55" style="animation-delay:0.0s;transform-origin:85px 230px"/><rect x="116" y="168" width="30" height="62" rx="4" fill="#29B6F6" opacity="0.63" style="animation-delay:0.25s;transform-origin:131px 230px"/><rect x="162" y="172" width="30" height="58" rx="4" fill="#29B6F6" opacity="0.71" style="animation-delay:0.5s;transform-origin:177px 230px"/><rect x="208" y="144" width="30" height="86" rx="4" fill="#29B6F6" opacity="0.79" style="animation-delay:0.75s;transform-origin:223px 230px"/><rect x="254" y="118" width="30" height="112" rx="4" fill="#29B6F6" opacity="0.87" style="animation-delay:1.0s;transform-origin:269px 230px"/><rect x="300" y="90" width="30" height="140" rx="4" fill="#8DC63F" opacity="0.95" style="animation-delay:1.25s;transform-origin:315px 230px"/><path class="ha-draw" d="M85 196 L131 176 L177 182 L223 150 L269 124 L315 96" fill="none" stroke="#F2A93B" stroke-width="3" style="stroke-dasharray:400;stroke-dashoffset:400;animation-duration:4s"/><g class="ha-pulse"><circle cx="315" cy="96" r="12" fill="#F2A93B"/><text class="ha-label" x="315" y="101" text-anchor="middle" style="font-size:13px;fill:#13366E">$</text></g><g class="ha-float" style="animation-delay:0.0s"><rect x="22" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#8DC63F" stroke-width="1.8"/><text class="ha-label" x="74" y="286" text-anchor="middle" style="font-size:13px">Cash</text></g><g class="ha-float" style="animation-delay:0.5s"><rect x="148" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#29B6F6" stroke-width="1.8"/><text class="ha-label" x="200" y="286" text-anchor="middle" style="font-size:13px">Margin</text></g><g class="ha-float" style="animation-delay:1.0s"><rect x="274" y="266" width="104" height="30" rx="8" fill="#13366E" stroke="#F2A93B" stroke-width="1.8"/><text class="ha-label" x="326" y="286" text-anchor="middle" style="font-size:13px">Pipeline</text></g></svg>