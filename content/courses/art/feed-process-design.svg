<svg viewBox="0 0 400 320" role="img" aria-label="Animated illustration for FEED and Process Design Fundamentals" xmlns="http://www.w3.org/2000/svg"><style>.ha-spin{transform-box:fill-box;transform-origin:center;animation:ha-spin 12s linear infinite}.ha-spin-r{transform-box:fill-box;transform-origin:center;animation:ha-spin 8s linear infinite reverse}.ha-pulse{transform-box:fill-box;transform-origin:center;animation:ha-pulse 2.4s ease-in-out infinite}.ha-float{animation:ha-float 4s ease-in-out infinite}.ha-draw{stroke-dasharray:600;stroke-dashoffset:600;animation:ha-draw 3.2s ease-out infinite}.ha-grow{transform-box:fill-box;transform-origin:left center;animation:ha-grow 6s ease-in-out infinite}.ha-drop{animation:ha-drop 6s cubic-bezier(.2,.8,.2,1) infinite}.ha-twinkle{transform-box:fill-box;transform-origin:center;animation:ha-twinkle 2.2s ease-in-out infinite}.ha-label{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;fill:#F6F5F1}.ha-small{font-family:'Inter',system-ui,sans-serif;font-size:11px;fill:#B4C2D6;letter-spacing:.06em}@keyframes ha-spin{to{transform:rotate(360deg)}}@keyframes ha-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}@keyframes ha-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes ha-draw{0%{stroke-dashoffset:600}60%,100%{stroke-dashoffset:0}}@keyframes ha-grow{0%{transform:scaleX(0)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}@keyframes ha-drop{0%{transform:translateY(-60px);opacity:0}12%,88%{transform:none;opacity:1}100%{opacity:0}}@keyframes ha-twinkle{0%,100%{transform:scale(.4);opacity:0}50%{transform:scale(1);opacity:1}}@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}.ha-draw{stroke-dashoffset:0}}</style><defs><marker id="fd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#29B6F6"/></marker><marker id="fd-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8DC63F"/></marker></defs><text class="ha-small" x="200" y="26" text-anchor="middle">DEFINE IT BEFORE YOU BUILD IT</text><path d="M20 150 H62" stroke="#29B6F6" stroke-width="2.5" marker-end="url(#fd-a)"/><text class="ha-small" x="20" y="140">FEED</text><circle cx="86" cy="150" r="22" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><path d="M68 162 L80 140 L92 160 L104 138" fill="none" stroke="#F2A93B" stroke-width="2"/><text class="ha-small" x="86" y="190" text-anchor="middle">E-101</text><path d="M108 150 H140" stroke="#29B6F6" stroke-width="2.5" marker-end="url(#fd-a)"/><rect x="144" y="92" width="52" height="116" rx="26" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><g class="ha-pulse"><circle cx="170" cy="150" r="9" fill="#F2A93B" opacity=".85"/></g><text class="ha-small" x="170" y="82" text-anchor="middle">R-101</text><path d="M196 150 H232" stroke="#29B6F6" stroke-width="2.5" marker-end="url(#fd-a)"/><rect x="236" y="122" width="80" height="56" rx="28" fill="#13366E" stroke="#29B6F6" stroke-width="2"/><text class="ha-small" x="262" y="198" text-anchor="middle">V-101</text><path d="M316 140 H366" stroke="#29B6F6" stroke-width="2.5" marker-end="url(#fd-a)"/><text class="ha-small" x="380" y="132" text-anchor="end">PRODUCT</text><path class="ha-draw" d="M300 175 V246 H184 V214" fill="none" stroke="#8DC63F" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#fd-g)" style="animation-duration:5s"/><text class="ha-small" x="242" y="264" text-anchor="middle">RECYCLE</text><g class="ha-twinkle" style="animation-delay:.3s"><circle cx="276" cy="112" r="11" fill="none" stroke="#F2A93B" stroke-width="2"/><text class="ha-small" x="276" y="116" text-anchor="middle" style="font-size:9px;fill:#F6F5F1">PSV</text></g><path d="M276 122 V112" stroke="#F2A93B" stroke-width="2"/><g class="ha-float"><rect x="40" y="276" width="320" height="28" rx="8" fill="none" stroke="#4A6089" stroke-width="1.5"/><text class="ha-small" x="200" y="294" text-anchor="middle">DESIGN BASIS · PFD · P&amp;ID · HAZOP · ESTIMATE</text></g></svg>