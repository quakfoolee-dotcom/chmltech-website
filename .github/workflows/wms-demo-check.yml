name: WMS browser demo checks
on:
  pull_request:
    paths: ['WMS_demo/**', 'scripts/wms-demo.test.mjs', '.github/workflows/wms-demo-check.yml']
  push:
    branches: [main]
    paths: ['WMS_demo/**', 'scripts/wms-demo.test.mjs', '.github/workflows/wms-demo-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test scripts/wms-demo.test.mjs
